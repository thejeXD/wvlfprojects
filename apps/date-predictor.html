    <section class="date-predictor-section">
        <div class="container">
            <h1 class="page-title">Date Predictor</h1>
            <p class="page-subtitle">Travel through time with past or future dates.</p>

            <div class="predictor-card">
                <form id="predictor-form">
                    
                    <div class="form-group">
                        <label for="startDate">Starting Date</label>
                        <input type="date" id="startDate" required />
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="periodType">Period</label>
                            <select id="periodType">
                                <option value="days">Days</option>
                                <option value="weeks">Weeks</option>
                                <option value="months">Months</option>
                                <option value="years">Years</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="periodValue">Value</label>
                            <input type="number" id="periodValue" value="7" min="1" required />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="direction">Direction</label>
                        <select id="direction">
                            <option value="future">Into the Future</option>
                            <option value="past">Back to the Past</option>
                        </select>
                    </div>

                    <button type="submit" class="cta-button">Predict Date</button>
                </form>
            </div>
            
            <div class="console-output-area">
                <div class="console-header">
                    C:\> Executing DatePrediction.exe
                </div>
                <pre id="console-output" class="console-body">Initializing...</pre>
            </div>
            
            <div class="result-display">
                <div class="result-label">Result Output</div>
                <div id="finalResult" class="result-value">{ Waiting for prediction... }</div>
            </div>
        </div>
    </section>

    </body>
