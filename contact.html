    <script src="../js/main.js" defer></script>
</head>
<body>

        <div class="nav-brand">Wolf</div>
        <div class="nav-links">
          <a href="#apps">Apps</a>

            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"

          <button
            class="theme-toggle"
            onclick="toggleTheme()"
            id="theme-toggle"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="currentColor"
              id="theme-icon"

              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />

        </div>
      </div>

    <section id="contact" class="contact-section">
        <div class="container">
            <h2 class="section-title">Get in Touch</h2>
            <p class="contact-subtitle">
                Have a question about my apps, want to collaborate on a Roblox project, or just want to say hi? Send me a message!
            </p>

            <div class="contact-form-container">
                <form action="YOUR_FORM_SUBMISSION_URL" method="POST" class="contact-form">
                    
                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" required />
                    </div>

                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" required />
                    </div>
                    
                    <div class="form-group">
                        <label for="subject">Subject (Optional)</label>
                        <input type="text" id="subject" name="_subject" />
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>

                    <button type="submit" class="cta-button form-submit-btn">Send Message</button>
                </form>
            </div>

            <div class="contact-links">
                <p>or connect with me directly:</p>
                <div class="links-grid">
                    <a href="mailto:your.email@example.com" class="contact-link">
                        <span class="icon">📧</span> Email
                    </a>
                    <a href="https://github.com/thejeXD" target="_blank" class="contact-link">
                        <span class="icon">💻</span> GitHub
                    </a>
                    <a href="https://www.roblox.com/users/your-id" target="_blank" class="contact-link">
                        <span class="icon">🎮</span> Roblox Profile
                    </a>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
      <div class="container">
        <p>Created by Wolf with ❤️</p>
        <p class="footer-links">
          <a
            href="https://github.com/thejeXD/wvlfgradecalculator"
            target="_blank"
            >GitHub</a
          >
          <span>•</span>
          <a href="mailto:your.email@example.com">Contact</a>
        </p>
        <p class="copyright">© 2025 All Rights Reserved</p>
      </div>
    </footer>
</body>
</html>
