    <section id="contact" class="contact-section">
        <div class="container">
            <h2 class="section-title">Get in Touch</h2>
            <p class="contact-subtitle">
                Have a question about my apps, want to collaborate on a Roblox project, or just want to say hi? Send me a message!
            </p>

            <div class="contact-form-container">
                <!-- 
                  - 'name="contact"' gives the form a name in the Netlify UI.
                  - 'data-netlify="true"' enables Netlify form handling.
                  - 'data-netlify-honeypot="bot-field"' is for spam prevention.
                -->
                <form name="contact" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" class="contact-form">
                    <!-- This hidden input is required for Netlify forms to work correctly -->
                    <input type="hidden" name="form-name" value="contact" />
                    <!-- This is the hidden honeypot field for spam prevention -->
                    <div style="display: none;">
                        <label>Don’t fill this out if you’re human: <input name="bot-field" /></label>
                    </div>

                    <div class="form-group">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" required />
                    </div>

                    <div class="form-group">
                        <label for="email">Your Email</label>
                        <input type="email" id="email" name="email" required />
                    </div>
                    
                    <div class="form-group">
                        <label for="subject">Subject (Optional)</label>
                        <input type="text" id="subject" name="subject" />
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="6" required></textarea>
                    </div>

                    <button type="submit" class="cta-button form-submit-btn">Send Message</button>
                </form>
            </div>

            <div class="contact-links">
                <p>or connect with me directly:</p>
                <div class="links-grid">
                    <a href="mailto:contact@wolfprojects.dev" class="contact-link">
                        <span class="icon">📧</span> Email
                    </a>
                    <a href="https://github.com/thejeXD" target="_blank" class="contact-link">
                        <span class="icon">💻</span> GitHub
                    </a>
                    <a href="https://www.roblox.com/users/30289538/profile" target="_blank" class="contact-link">
                        <span class="icon">🎮</span> Roblox Profile
                    </a>
                </div>
            </div>
        </div>
    </section>
